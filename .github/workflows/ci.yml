name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Locate Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME" || { echo "No Chrome/Chromium found"; exit 1; }
          echo "CHROMIUM_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: PWA probe
        run: npm run probe
      - name: Pages mount probe
        run: npm run probe:pages
